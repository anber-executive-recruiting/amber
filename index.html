<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amber Executive Recruiting – Application Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
 --brown-dark:#3D2008;--brown-mid:#5C3A1E;--brown-light:#8B5E3C;
 --brown-warm:#A67C52;--gold:#D4A96A;--gold-light:#E8C99A;
 --cream:#FDF8F3;--cream-dark:#F5EDE0;--white:#FFFFFF;
 --text-dark:#2C1A0E;--text-mid:#5C3A1E;--text-light:#8B7355;
 --border:#E8D5C0;--shadow:rgba(92,58,30,0.12);--shadow-hover:rgba(92,58,30,0.22);
 --radius:12px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--text-dark);overflow-x:hidden;line-height:1.6;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--cream-dark);}::-webkit-scrollbar-thumb{background:var(--brown-warm);border-radius:3px;}
form {
  max-width: 500px;
  margin: 120px auto 50px;
  padding: 20px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.form-group {
  margin-bottom: 18px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 6px;
}
       
/* NAV */
nav{position:fixed;top:0;left:0;width:100%;z-index:1000;transition:var(--transition);padding:18px 0;}
nav.scrolled{background:rgba(253,248,243,0.97);backdrop-filter:blur(20px);box-shadow:0 2px 24px var(--shadow);padding:12px 0;}
.nav-container{max-width:1200px;margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:14px;text-decoration:none;}
.nav-logo img{height:44px;width:auto;object-fit:contain;}
.nav-brand{display:flex;flex-direction:column;}
.nav-brand-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--brown-dark);letter-spacing:1px;line-height:1.1;}
.nav-brand-sub{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--brown-warm);}
.nav-links{display:flex;align-items:center;gap:36px;}
.nav-links a{text-decoration:none;font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mid);transition:var(--transition);position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:var(--transition);}
.nav-links a:hover::after,.nav-links a.active::after{width:100%;}
.nav-links a:hover,.nav-links a.active{color:var(--brown-dark);}
.nav-cta{background:var(--brown-mid)!important;color:var(--white)!important;padding:10px 24px!important;border-radius:50px!important;}
.nav-cta::after{display:none!important;}
.nav-cta:hover{background:var(--brown-dark)!important;transform:translateY(-1px)!important;}
.nav-mobile-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.nav-mobile-btn span{width:24px;height:2px;background:var(--brown-mid);border-radius:2px;}

/* HERO */
#home{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding-top:80px;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(135deg,rgba(253,248,243,0.96) 0%,rgba(245,237,224,0.82) 45%,rgba(212,169,106,0.12) 100%);}

<body>

<!-- NAV -->
<nav id="navbar">
 <div class="nav-container">
  <a href="#home" class="nav-logo">
   <img src="https://images.squarespace-cdn.com/content/v1/60d7a5bc3c4be94ff29d51fc/1a368691-34ca-44c1-acb8-385ac70303dc/02_Hero.png" alt="Amber Executive Recruiting"/>
   <div class="nav-brand">
    <span class="nav-brand-name">Amber Executive</span>
    <span class="nav-brand-sub">Recruiting</span>
   </div>
  </a>
  <div class="nav-links" id="navLinks">
   <a href="#home" class="active">Home</a>
   <a href="#about">About</a>
   <a href="#apply" class="nav-cta">Apply Now</a>
  </div>

 </div>

<!-- Inserted by script: optional LinkedIn and Website fields will be added under the Summary textarea -->

<script>
(function(){
  // Insert optional fields after the Summary textarea (step 2)
  var summaryEl = document.getElementById('summary');
  if (!summaryEl) return;

  function makeField(id, labelText, placeholder){
    var wrapper = document.createElement('div');
    wrapper.className = 'form-group';

    var label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = labelText;

    var input = document.createElement('input');
    input.type = 'url';
    input.id = id;
    input.name = id;
    input.placeholder = placeholder;
    input.pattern = 'https?://.+';
    input.setAttribute('aria-describedby', id + '-hint ' + id + '-error');

    var hint = document.createElement('small');
    hint.id = id + '-hint';
    hint.className = 'hint';
    hint.textContent = 'Optional — include https://';

    var err = document.createElement('div');
    err.id = id + '-error';
    err.className = 'error';
    err.style.display = 'none';

    wrapper.appendChild(label);
    wrapper.appendChild(input);
    wrapper.appendChild(hint);
    wrapper.appendChild(err);
    return wrapper;
  }

  var linkedinField = makeField('linkedin_url','LinkedIn URL (optional)','https://www.linkedin.com/in/yourprofile');
  var websiteField = makeField('website_url','Website / Portfolio URL (optional)','https://yoursite.com');

  // find the container to insert into: the summary's form-group (or parent)
  var container = summaryEl.closest('.form-group') || summaryEl.parentNode;
  if (container && container.parentNode) {
    container.parentNode.insertBefore(linkedinField, container.nextSibling);
    container.parentNode.insertBefore(websiteField, linkedinField.nextSibling);
  }

  // Client-side validation on continue button in fs2
  var continueBtn = document.querySelector('#fs2 .btn-next');
  function isValidUrl(v){ if(!v) return true; try{ var u = new URL(v); return u.protocol === 'http:' || u.protocol === 'https:'; } catch(e){ return false; } }

  if (continueBtn) {
    continueBtn.addEventListener('click', function(e){
      var linkedin = document.getElementById('linkedin_url');
      var website = document.getElementById('website_url');
      var ok = true;

      document.getElementById('linkedin_url-error') && (document.getElementById('linkedin_url-error').style.display='none');
      document.getElementById('website_url-error') && (document.getElementById('website_url-error').style.display='none');

      if (linkedin && linkedin.value && !isValidUrl(linkedin.value)){
        var el = document.getElementById('linkedin_url-error');
        if (el){ el.textContent = 'Please enter a valid LinkedIn URL (include https://)'; el.style.display='block'; }
        ok = false;
      }
      if (website && website.value && !isValidUrl(website.value)){
        var el2 = document.getElementById('website_url-error');
        if (el2){ el2.textContent = 'Please enter a valid Website or Portfolio URL (include https://)'; el2.style.display='block'; }
        ok = false;
      }
      if (!ok) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  }
})();
</script>

</body>
</html>
