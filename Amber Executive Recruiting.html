<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amber Executive Recruiting</title>
  <style>
    /* Ensure no gaps: iframe fills entire remaining viewport */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #fff;
      color: #222;
    }

    /* Minimal top bar containing only recruiter email (per upload change) */
    .top-bar{
      padding: 10px 14px;
      background: #f7f6f3;
      border-bottom: 1px solid #e8e4dd;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .top-bar label{font-size:13px;color:#444;margin-right:6px;}
    .top-bar input[type="email"]{
      padding:8px 10px;border-radius:8px;border:1px solid #dcd6cc;background:white;font-size:13px;min-width:300px;box-sizing:border-box;
    }
    .spacer{flex:1 1 auto}

    .iframe-wrap{flex:1 1 auto; display:block; min-height:0;}
    .iframe-wrap iframe{display:block;width:100%;height:100%;border:0}

    @media (max-width:600px){
      .top-bar input{min-width:160px}
    }
  </style>
</head>
<body>
  <!-- Top bar kept minimal with only recruiter email field (updated) -->
  <div class="top-bar" role="region" aria-label="Recruiter email">
    <label for="recruiterEmail">Recruiter Email</label>
    <input id="recruiterEmail" name="recruiterEmail" type="email" value="keithashton.search@gmail.com" aria-describedby="recruiter-hint" />
    <div class="spacer"></div>
  </div>

  <div class="iframe-wrap">
    <iframe id="gasiframe" src="https://script.google.com/macros/s/AKfycbzLHP8F48chToOSVKqhmqy7SW9CBIUs-bZMo4KLMv6xv4kseiiLdb7KOIvGiyR2Wm4Fvg/exec" title="Amber Application"></iframe>
  </div>

  <script>
    // Keep simple: nothing injected into iframe due to cross-origin restrictions.
    // Visual validation: mark invalid email border color on blur if invalid.
    var rec = document.getElementById('recruiterEmail');
    rec && rec.addEventListener('blur', function(){
      var v = this.value;
      var ok = !v || /^\S+@\S+\.\S+$/.test(v);
      this.style.borderColor = ok ? '#dcd6cc' : '#e06a6a';
    });
  </script>
</body>
</html>
